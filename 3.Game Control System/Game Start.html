    if(cams.length&&cams.some(c=>!c.named)){
      // ยังไม่เห็นชื่อกล้อง: ถ้าเคยอนุญาตแล้วหรือผู้ใช้กดเลือกเอง จึงขอสิทธิ์เพื่อดึงชื่อจริง
      if(ask||await C.hasCameraPermission()){if(await C.unlockCameraLabels())cams=await C.listCameras();}
    }
    const unnamed=cams.some(c=>!c.named);
    sel.innerHTML=(cams.length?'':'<option value="">ไม่พบกล้อง</option>')+
      (cams.length?'<option value="">กล้องเริ่มต้น'+(unnamed?' (กดเพื่อแสดงชื่อกล้อง)':'')+'</option>':'')+
      cams.map(c=>'<option value="'+c.id+'">'+c.label.replace(/</g,'&lt;')+'</option>').join('');
    sel.value=cams.some(c=>c.id===cfg.cameraId)?cfg.cameraId:'';
    sel.dataset.unnamed=unnamed?'1':'';
  }catch(e){}
}
$('s-camid').addEventListener('mousedown',()=>{if($('s-camid').dataset.unnamed)fillCameras(true)});
if(navigator.mediaDevices&&navigator.mediaDevices.addEventListener)navigator.mediaDevices.addEventListener('devicechange',()=>{if(!$('settings').hidden)fillCameras()});
$('s-camtest').onclick=async()=>{
  const v=$('s-prev');$('s-err').textContent='';
  if(C.isCameraOn()&&!v.hidden){C.stopCamera(v);v.hidden=true;$('s-camtest').textContent='ทดสอบกล้อง';return;}
  try{await C.startCamera(v,$('s-camid').value);v.hidden=false;$('s-camtest').textContent='ปิดกล้องทดสอบ';await fillCameras(true);}
  catch(e){$('s-err').textContent=e.message}
};
// ---- ตั้งค่า ----
$('s-save').onclick=()=>{
  const cd=+$('s-cd').value,rest=+$('s-rest').value,name=$('s-name').value.trim();
  if(!Number.isInteger(cd)||cd<0||cd>10)return $('s-err').textContent='นับถอยหลังต้องเป็นจำนวนเต็ม 0-10';
  if(!Number.isInteger(rest)||rest<1||rest>60)return $('s-err').textContent='เวลาพักต้องเป็นจำนวนเต็ม 1-60';
  cfg.camera=$('s-cam').checked;cfg.cameraId=$('s-camid').value;C.stopCamera($('s-prev'));$('s-prev').hidden=true;$('s-camtest').textContent='ทดสอบกล้อง';
  cfg.playerName=name||'ผู้เล่น';cfg.countdownSec=cd;cfg.restSec=rest;saveCfg();
  st.playerName=cfg.playerName;st.countdownSec=cd;st.restSec=rest;
  renderHome();show('home');
};

// ---- เลือกท่า ----
function renderList(){
  $('list').innerHTML='';$('err').textContent='';
  const lv=G.DIFFICULTY[st.difficulty];
  S.getCatalog().forEach(c=>{
    const q=st.queue.find(x=>x.id===c.id),d=document.createElement('div');d.className='ex';
    const reps=q?q.reps:Math.max(1,Math.round(c.reps*lv.repsMul)),sec=q?q.durationSec:Math.round(c.durationSec*lv.timeMul);
    d.innerHTML=`<input type="checkbox" ${q?'checked':''}><b>${c.name}<small>${c.target}</small></b>
      <label>ครั้ง <input type="number" class="r" min="1" max="100" value="${reps}"></label>
      <label>วิ <input type="number" class="t" min="5" max="600" value="${sec}"></label>`;
    const [cb]=d.querySelectorAll('input'),r=d.querySelector('.r'),t=d.querySelector('.t');
    const apply=()=>{try{$('err').textContent='';
      if(!cb.checked){S.deselectExercise(st,c.id);return;}
      if(!st.queue.some(x=>x.id===c.id))S.selectExercise(st,c.id,{reps:+r.value,durationSec:+t.value});
      else S.setExerciseTarget(st,c.id,{reps:+r.value,durationSec:+t.value});
    }catch(e){$('err').textContent=e.message}};
    cb.onchange=r.onchange=t.onchange=apply;$('list').appendChild(d);
  });
}
$('all').onclick=()=>{S.clearSelection(st);S.selectAll(st);renderList()};
$('clr').onclick=()=>{S.clearSelection(st);renderList()};

// ---- เล่นเกม ----
function render(){
  const p=P.getProgress(st);
  if(st.status==='countdown'){$('big').textContent=p.countdownLeftSec;$('name').textContent='เตรียมตัว '+st.playerName+'...';$('info').textContent='';return;}
  if(!p.exercise)return;
  $('big').textContent=p.resting?p.restLeftSec:p.repsDone+'/'+p.exercise.reps;
  $('name').textContent=(p.resting?'พัก — ถัดไป: ':'')+p.exercise.name+` (${p.index+1}/${p.total})`;
  $('info').textContent=st.status==='paused'?'หยุดชั่วคราว':`เหลือเวลา ${p.timeLeftSec} วินาที`;
}
const detector=C.createMotionRepDetector({onRep:()=>P.registerRep(st)});
function loop(now){
  const d=now-last;last=now;P.tick(st,d);
  if(C.isCameraOn()){
    const active=st.status==='playing'&&st.current&&!st.current.resting;
    if(active){const sc=detector.update($('cam'),now);$('mfill').style.width=Math.min(100,sc/detector.highThreshold*100)+'%';}
    else{detector.reset();$('mfill').style.width='0';}
  }
  render();
  if(st.status==='finished')return finish();
  raf=requestAnimationFrame(loop);
}
function stopCam(){C.stopCamera($('cam'));$('cam').hidden=true;$('mbar').hidden=true;}
function finish(){
  cancelAnimationFrame(raf);stopCam();const s=E.getEndSummary(st);
  $('sum').innerHTML=`<p>${st.playerName} ทำสำเร็จ ${s.completedExercises}/${s.totalExercises} ท่า · รวม ${s.totalReps} ครั้ง · ${s.totalTimeSec} วินาที</p>`+
   s.results.map(r=>`<div class="ex"><b>${r.name}</b><span>${r.repsDone}/${r.targetReps}</span></div>`).join('');
  show('done');
}
$('go').onclick=async()=>{
  try{
    if(!st.queue.length)throw new Error('กรุณาเลือกท่าบริหารอย่างน้อย 1 ท่าก่อนเริ่มเกม');
    $('camerr').textContent='';
    show('play');
    if(cfg.camera){
      try{await C.startCamera($('cam'),cfg.cameraId);$('cam').hidden=false;$('mbar').hidden=false;detector.reset();}
      catch(e){$('camerr').textContent=e.message+' — ใช้ปุ่มกดนับแทนได้';}
    }
    G.startGame(st);$('pause').textContent='หยุด';last=performance.now();raf=requestAnimationFrame(loop);
  }catch(e){show('setup');$('err').textContent=e.message}
};
$('rep').onclick=()=>P.registerRep(st);
$('skip').onclick=()=>P.skipExercise(st);
$('pause').onclick=()=>{E.togglePause(st);$('pause').textContent=st.status==='paused'?'เล่นต่อ':'หยุด'};
$('end').onclick=()=>{E.endGame(st);finish()};
$('rep').title='ใช้เมื่อไม่ได้เปิดกล้อง หรือกล้องนับไม่ทัน';
$('again').onclick=()=>{E.resetGame(st);renderList();show('setup')};

renderHome();show('home');
</script></body></html>

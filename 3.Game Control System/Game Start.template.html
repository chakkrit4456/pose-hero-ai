<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOVE & RELIEVE</title>
<script>try{var t=JSON.parse(localStorage.getItem('move-relieve-settings')||'{}').theme;if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap');
:root{--bg:#fff7e0;--card:#ffffff;--ink:#2b2350;--mut:#7a6f9e;--acc:#ff6b9d;--acc2:#4ecdc4;--sun:#ffd93d;--line:#ffe0a8;--sh:0 6px 0 rgba(43,35,80,.12);--nav:#fff;--glow1:#ffe0f0;--glow2:#d6f7f3;--glow3:#fff0b8;--hover:#fff2b8;--lv1:#d9f9e7;--lv2:#fff2b8;--lv3:#ffd5df;--field:#fff;--play2:#fff7fb;--edge:#2b2350}
:root[data-theme=dark]{--bg:#16122b;--card:#231d45;--ink:#f1ecff;--mut:#a89ed0;--line:#3b3270;--sh:0 6px 0 rgba(0,0,0,.45);--nav:#1c1738;--glow1:#3a1a4d;--glow2:#12384a;--glow3:#3a3012;--hover:#33295f;--lv1:#1d4a37;--lv2:#4d4413;--lv3:#58203a;--field:#1a1536;--play2:#2a2152;--edge:#f1ecff;--acc2:#3bb8b0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]):not([data-theme=dark]){--bg:#16122b;--card:#231d45;--ink:#f1ecff;--mut:#a89ed0;--line:#3b3270;--sh:0 6px 0 rgba(0,0,0,.45);--nav:#1c1738;--glow1:#3a1a4d;--glow2:#12384a;--glow3:#3a3012;--hover:#33295f;--lv1:#1d4a37;--lv2:#4d4413;--lv3:#58203a;--field:#1a1536;--play2:#2a2152;--edge:#f1ecff;--acc2:#3bb8b0}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.5 Prompt,system-ui,"Noto Sans Thai",sans-serif;min-height:100vh;
 background:radial-gradient(circle at 10% 10%,var(--glow1) 0,transparent 35%),radial-gradient(circle at 90% 20%,var(--glow2) 0,transparent 35%),radial-gradient(circle at 50% 100%,var(--glow3) 0,transparent 45%),var(--bg);background-attachment:fixed}
main{max-width:640px;margin:0 auto;padding:24px 16px}
h1{margin:0 0 4px;text-align:center;font-size:34px;font-weight:700;background:linear-gradient(90deg,#ff6b9d,#ff9f43,#4ecdc4);-webkit-background-clip:text;background-clip:text;color:transparent}
h1::before{content:"🤸 "}
p.s{color:var(--mut);margin:0 0 24px;text-align:center;font-weight:600}
h2{margin-top:0;font-weight:700}
.card{background:var(--card);border:3px solid var(--edge);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed var(--line)}
.ex:last-child{border:0}.ex b{flex:1}.ex small{color:var(--mut);display:block;font-weight:400}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
input[type=range]{accent-color:var(--acc)}
input[type=number],input[type=text],select{width:72px;padding:6px 8px;border:2px solid var(--edge);border-radius:12px;background:var(--field);color:var(--ink);font:inherit}
input[type=text]{width:100%}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:16px;border:3px solid var(--edge);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--edge);transition:transform .08s,box-shadow .08s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--edge)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
button.p{background:linear-gradient(180deg,#ff8fb8,var(--acc));color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--edge)}
.menu{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.menu button{padding:18px;font-size:22px}
#m-start{background:linear-gradient(180deg,#ffe56b,var(--sun));font-size:30px;padding:24px}
#m-start::before{content:"▶ "}
#m-level{background:linear-gradient(180deg,#8ee9e1,var(--acc2))}
#m-level::before{content:"⭐ "}
#m-set{background:linear-gradient(180deg,#c9b8ff,#a78bfa)}
#m-set::before{content:"⚙️ "}
.big{font-size:96px;font-weight:700;text-align:center;color:var(--acc);text-shadow:4px 4px 0 var(--sun);animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.c{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.err{color:#e0245e;min-height:1.5em;font-weight:600}
.lv{display:block;width:100%;text-align:left;margin-bottom:12px;padding:14px;font-size:20px}
.lv:nth-child(1){background:var(--lv1)}.lv:nth-child(2){background:var(--lv2)}.lv:nth-child(3){background:var(--lv3)}
.lv.on{outline:4px solid var(--acc);outline-offset:2px}
.lv.on::after{content:" ✔";color:var(--acc)}
.lv small{display:block;color:var(--mut);font-weight:400;font-size:14px}
video.cam{width:100%;max-width:320px;border-radius:18px;border:3px solid var(--edge);box-shadow:var(--sh);background:#000;transform:scaleX(-1);display:block;margin:0 auto 10px}
.mbar{height:14px;background:var(--card);border:3px solid var(--edge);border-radius:10px;overflow:hidden;max-width:320px;margin:0 auto 12px}
.mbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--sun),var(--acc))}
.f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.mascot[hidden]{display:none}
.mascot{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:8px 0 0;padding-top:8px}
.mascot svg{width:170px;height:auto;flex:0 0 auto;overflow:visible;animation:bob 2s ease-in-out infinite}
.mascot .wave{transform-box:fill-box;transform-origin:10% 90%;animation:wave 1s ease-in-out infinite}
.mascot .blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.bubble{position:relative;background:var(--card);border:3px solid var(--edge);border-radius:20px;padding:10px 16px;font-weight:700;font-size:18px;box-shadow:var(--sh);margin-bottom:70px;max-width:190px;text-align:center}
.bubble::after{content:"";position:absolute;left:-14px;bottom:14px;border:8px solid transparent;border-right:14px solid var(--edge)}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(28deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@media(prefers-reduced-motion:reduce){.mascot svg,.mascot .wave,.mascot .blink{animation:none}}
#play{background:linear-gradient(180deg,var(--card),var(--play2))}
</style></head><body>
<main>
<h1>MOVE &amp; RELIEVE</h1><p class="s">ขยับกาย ทลายเมื่อย</p>

<section id="home" class="card">
  <p class="c" id="hello" style="margin:0 0 4px"></p>
  <p class="c" id="lvnow" style="color:var(--mut);margin:0"></p>
  <div class="menu">
    <button id="m-start" class="p">เริ่ม</button>
    <button id="m-level">ระดับความยาก</button>
    <button id="m-set">ตั้งค่า</button>
  </div>
</section>

  <div class="mascot" id="mascot" aria-label="มาสคอตกบโบกมือทักทาย">
    <svg viewBox="0 0 200 220" role="img" aria-hidden="true">
      <ellipse cx="100" cy="212" rx="58" ry="7" fill="#000" opacity=".12"/>
      <!-- เท้ากบ -->
      <ellipse cx="68" cy="198" rx="26" ry="11" fill="#5ccf4a" stroke="#2b2350" stroke-width="4"/>
      <ellipse cx="132" cy="198" rx="26" ry="11" fill="#5ccf4a" stroke="#2b2350" stroke-width="4"/>
      <!-- ลำตัว -->
      <ellipse cx="100" cy="140" rx="60" ry="58" fill="#7ee06a" stroke="#2b2350" stroke-width="4"/>
      <ellipse cx="100" cy="157" rx="38" ry="34" fill="#eaffd8"/>
      <!-- แขนซ้าย -->
      <path d="M46 138 Q26 148 32 170" fill="none" stroke="#2b2350" stroke-width="16" stroke-linecap="round"/>
      <path d="M46 138 Q26 148 32 170" fill="none" stroke="#7ee06a" stroke-width="8" stroke-linecap="round"/>
      <!-- แขนขวาโบกมือ -->
      <g class="wave">
        <path d="M152 128 Q178 108 176 76" fill="none" stroke="#2b2350" stroke-width="16" stroke-linecap="round"/>
        <path d="M152 128 Q178 108 176 76" fill="none" stroke="#7ee06a" stroke-width="8" stroke-linecap="round"/>
        <circle cx="176" cy="68" r="13" fill="#7ee06a" stroke="#2b2350" stroke-width="4"/>
        <path d="M170 58 L170 52 M177 56 L177 49 M184 58 L185 52" stroke="#2b2350" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <!-- หัว: ตาโปน -->
      <circle cx="66" cy="78" r="27" fill="#7ee06a" stroke="#2b2350" stroke-width="4"/>
      <circle cx="134" cy="78" r="27" fill="#7ee06a" stroke="#2b2350" stroke-width="4"/>
      <circle cx="66" cy="76" r="18" fill="#fff" stroke="#2b2350" stroke-width="3"/>
      <circle cx="134" cy="76" r="18" fill="#fff" stroke="#2b2350" stroke-width="3"/>
      <g class="blink"><circle cx="69" cy="78" r="9" fill="#2b2350"/><circle cx="131" cy="78" r="9" fill="#2b2350"/></g>
      <circle cx="72" cy="74" r="3" fill="#fff"/><circle cx="134" cy="74" r="3" fill="#fff"/>
      <!-- แก้ม ปาก -->
      <ellipse cx="54" cy="124" rx="12" ry="7" fill="#ff6b9d" opacity=".65"/>
      <ellipse cx="146" cy="124" rx="12" ry="7" fill="#ff6b9d" opacity=".65"/>
      <circle cx="93" cy="108" r="2.5" fill="#2b2350"/><circle cx="107" cy="108" r="2.5" fill="#2b2350"/>
      <path d="M62 116 Q100 152 138 116 Q100 126 62 116 Z" fill="#c0392b" stroke="#2b2350" stroke-width="4" stroke-linejoin="round"/>
      <path d="M84 134 Q100 144 116 134 Q100 126 84 134 Z" fill="#ff8fb8"/>
      <!-- ผ้าคาดหัว -->
      <path d="M62 54 Q100 40 138 54" fill="none" stroke="#2b2350" stroke-width="14" stroke-linecap="round"/>
      <path d="M62 54 Q100 40 138 54" fill="none" stroke="#ff6b9d" stroke-width="7" stroke-linecap="round"/>
    </svg>
    <div class="bubble">ออกกำลังกายกันเถอะ!</div>
  </div>

<section id="level" class="card" hidden>
  <h2>ระดับความยาก</h2>
  <div id="levels"></div>
  <div class="row"><button class="back">กลับ</button></div>
</section>

<section id="settings" class="card" hidden>
  <h2>ตั้งค่า</h2>
  <div class="f"><label>ธีม</label><span class="row" id="s-theme">
    <button type="button" data-th="light">☀️ สว่าง</button><button type="button" data-th="dark">🌙 มืด</button><button type="button" data-th="auto">ตามระบบ</button></span></div>
  <div class="f"><label for="s-name">ชื่อผู้เล่น</label><input type="text" id="s-name" maxlength="20" style="max-width:240px"></div>
  <div class="f"><label for="s-cd">นับถอยหลังก่อนเริ่ม (วินาที)</label><input type="number" id="s-cd" min="0" max="10"></div>
  <div class="f"><label for="s-rest">พักระหว่างท่า (วินาที)</label><input type="number" id="s-rest" min="1" max="60"></div>
  <div class="f"><label for="s-vol">เสียง <span id="s-volv"></span></label>
    <span style="display:flex;gap:8px;align-items:center;flex:1;max-width:300px">
      <button id="s-down" type="button" aria-label="ลดเสียง">−</button>
      <input type="range" id="s-vol" min="0" max="100" step="5" style="flex:1">
      <button id="s-up" type="button" aria-label="เพิ่มเสียง">+</button>
      <button id="s-mute" type="button" aria-label="ปิด/เปิดเสียง">🔊</button>
    </span></div>
  <div class="f"><label for="s-cam">ใช้กล้องช่วยนับครั้ง</label><input type="checkbox" id="s-cam"></div>
  <div class="f"><label for="s-camid">เลือกกล้อง</label><select id="s-camid" style="width:100%;max-width:300px;padding:6px 8px"><option value="">กล้องเริ่มต้น</option></select></div>
  <div class="row" style="margin:4px 0"><button id="s-camtest" type="button">ทดสอบกล้อง</button></div>
  <video id="s-prev" class="cam" hidden></video>
  <p class="err" id="s-err"></p>
  <div class="row"><button class="back">กลับ</button><button id="s-save" class="p">บันทึก</button></div>
</section>

<section id="setup" class="card" hidden>
  <h2>เลือกท่าสำหรับผู้ที่เป็นออฟฟิศซินโดรม</h2>
  <div id="list"></div>
  <p class="err" id="err"></p>
  <div class="row"><button class="back">กลับ</button><button id="all">เลือกทั้งหมด</button><button id="clr">ล้าง</button><button id="go" class="p">เริ่มเกม</button></div>
</section>

<section id="play" class="card" hidden>
  <video id="cam" class="cam" hidden></video>
  <div class="mbar" id="mbar" hidden><i id="mfill"></i></div>
  <p class="c err" id="camerr"></p>
  <div class="big" id="big">3</div>
  <p class="c" id="name" style="font-size:20px;font-weight:600"></p>
  <p class="c" id="info"></p>
  <div class="row">
    <button id="rep" class="p">+1 ครั้ง (จำลอง)</button><button id="skip">ข้าม</button>
    <button id="pause">หยุด</button><button id="end">จบเกม</button>
  </div>
</section>

<section id="done" class="card" hidden>
  <h2>จบเกม</h2><div id="sum"></div>
  <div class="row" style="margin-top:12px"><button id="again" class="p">เล่นอีกครั้ง</button><button id="tohome">หน้าหลัก</button></div>
</section>
</main>
<script>
/*__MODULES__*/
const G=require('./2.1'),S=require('./2.2'),P=require('./2.3'),E=require('./2.4'),C=require('./2.5');
const $=id=>document.getElementById(id);
const PAGES=['home','level','settings','setup','play','done'];
const show=n=>{PAGES.forEach(k=>$(k).hidden=k!==n);$('mascot').hidden=n!=='home';};
function go(page){
  if(page==='setup')renderList();
  if(page==='level')renderLevels();
  if(page==='settings'){$('s-name').value=cfg.playerName;$('s-cd').value=cfg.countdownSec;$('s-rest').value=cfg.restSec;$('s-err').textContent='';syncVol();$('s-cam').checked=cfg.camera;fillCameras();}
  if(page!=='settings'){C.stopCamera($('s-prev'));$('s-prev').hidden=true;$('s-camtest').textContent='ทดสอบกล้อง';}
  if(page==='home')renderHome();
  if(st.status==='finished')E.resetGame(st);
  show(page);
}

// ---- การตั้งค่า (เก็บใน localStorage ถ้าใช้ได้) ----
const KEY='move-relieve-settings';
let cfg={playerName:'ผู้เล่น',countdownSec:3,restSec:5,difficulty:'normal',volume:60,muted:false,theme:'auto',camera:false,cameraId:''};
try{Object.assign(cfg,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const saveCfg=()=>{try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){}};

let st,last=0,raf=0;
function newState(keepQueue){
  const ids=st?st.queue.map(q=>q.id):[];
  st=G.createGameState(cfg);
  if(keepQueue)ids.forEach(id=>S.selectExercise(st,id));
}
newState();

// ---- หน้าหลัก ----
function renderHome(){
  $('hello').textContent='สวัสดี '+cfg.playerName;
  $('lvnow').textContent='ระดับความยาก: '+G.DIFFICULTY[cfg.difficulty].label;
}
$('m-start').onclick=()=>{renderList();show('setup')};
$('m-level').onclick=()=>{renderLevels();show('level')};
$('m-set').onclick=()=>go('settings');
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>{renderHome();show('home')});
$('tohome').onclick=()=>{E.resetGame(st);renderHome();show('home')};

// ---- ระดับความยาก ----
function renderLevels(){
  $('levels').innerHTML='';
  Object.entries(G.DIFFICULTY).forEach(([k,v])=>{
    const b=document.createElement('button');b.className='lv'+(k===cfg.difficulty?' on':'');
    b.innerHTML=`${v.label}<small>จำนวนครั้ง ×${v.repsMul} · เวลาต่อท่า ×${v.timeMul} · เวลาพัก ×${v.restMul}</small>`;
    b.onclick=()=>{cfg.difficulty=k;saveCfg();S.setDifficulty(st,k);renderLevels();renderHome()};
    $('levels').appendChild(b);
  });
}

// ---- เสียง (WebAudio, ปรับระดับด้วย cfg.volume) ----
let actx=null;
function beep(freq,ms=120,type='sine'){
  if(cfg.muted||cfg.volume<=0)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=(cfg.volume/100)*0.3;
    o.connect(g);g.connect(actx.destination);o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+ms/1000);
    o.stop(actx.currentTime+ms/1000);
  }catch(e){}
}
// เสียงพูดนับถอยหลัง (SpeechSynthesis ภาษาไทย) ถ้าเบราว์เซอร์ไม่รองรับจะใช้เสียงบี๊บแทน
const TH_NUM=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า','สิบ'];
function speak(text,fallbackHz){
  if(cfg.muted||cfg.volume<=0)return;
  try{
    if(!('speechSynthesis' in window))throw 0;
    const u=new SpeechSynthesisUtterance(text);
    u.lang='th-TH';u.volume=cfg.volume/100;u.rate=1.1;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){beep(fallbackHz)}
}
const sayCount=n=>{beep(660,100);speak(TH_NUM[n]??String(n),660)};
G.on(st,'start',()=>{if(st.status==='countdown')sayCount(st.countdownSec)});
G.on(st,'countdown',({secondsLeft})=>{if(secondsLeft>0)sayCount(secondsLeft)});
G.on(st,'go',()=>{beep(990,300);speak('เริ่ม',990)});
G.on(st,'rep',()=>beep(780,80));
G.on(st,'rest',()=>beep(440,200));
G.on(st,'rest-end',()=>beep(880,200));
G.on(st,'finish',()=>{beep(660,150);setTimeout(()=>beep(880,150),170);setTimeout(()=>beep(1100,250),340)});
function syncVol(){
  $('s-vol').value=cfg.volume;
  $('s-volv').textContent=cfg.muted?'(ปิดเสียง)':cfg.volume+'%';
  $('s-mute').textContent=cfg.muted||cfg.volume===0?'🔇':'🔊';
}
function setVol(v){cfg.volume=Math.max(0,Math.min(100,v));if(cfg.volume>0)cfg.muted=false;saveCfg();syncVol();beep(660,80)}
$('s-vol').oninput=()=>setVol(+$('s-vol').value);
$('s-down').onclick=()=>setVol(cfg.volume-10);
$('s-up').onclick=()=>setVol(cfg.volume+10);
$('s-mute').onclick=()=>{cfg.muted=!cfg.muted;saveCfg();syncVol();beep(660,80)};

// ---- ธีมสว่าง/มืด ----
const darkMQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
const isDark=()=>cfg.theme==='dark'||(cfg.theme==='auto'&&!!(darkMQ&&darkMQ.matches));
function applyTheme(){
  if(cfg.theme==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',cfg.theme);
  document.querySelectorAll('#s-theme button').forEach(b=>b.classList.toggle('p',b.dataset.th===cfg.theme));
}
function setTheme(t){cfg.theme=t;saveCfg();applyTheme()}
document.querySelectorAll('#s-theme button').forEach(b=>b.onclick=()=>setTheme(b.dataset.th));
if(darkMQ&&darkMQ.addEventListener)darkMQ.addEventListener('change',applyTheme);
applyTheme();

// ---- กล้อง ----
async function fillCameras(ask){
  const sel=$('s-camid');
  try{
    let cams=await C.listCameras();
    if(cams.length&&cams.some(c=>!c.named)){
      // ยังไม่เห็นชื่อกล้อง: ถ้าเคยอนุญาตแล้วหรือผู้ใช้กดเลือกเอง จึงขอสิทธิ์เพื่อดึงชื่อจริง
      if(ask||await C.hasCameraPermission()){if(await C.unlockCameraLabels())cams=await C.listCameras();}
    }
    const unnamed=cams.some(c=>!c.named);
    sel.innerHTML=(cams.length?'':'<option value="">ไม่พบกล้อง</option>')+
      (cams.length?'<option value="">กล้องเริ่มต้น'+(unnamed?' (กดเพื่อแสดงชื่อกล้อง)':'')+'</option>':'')+
      cams.map(c=>'<option value="'+c.id+'">'+c.label.replace(/</g,'&lt;')+'</option>').join('');
    sel.value=cams.some(c=>c.id===cfg.cameraId)?cfg.cameraId:'';
    sel.dataset.unnamed=unnamed?'1':'';
  }catch(e){}
}
$('s-camid').addEventListener('mousedown',()=>{if($('s-camid').dataset.unnamed)fillCameras(true)});
if(navigator.mediaDevices&&navigator.mediaDevices.addEventListener)navigator.mediaDevices.addEventListener('devicechange',()=>{if(!$('settings').hidden)fillCameras()});
$('s-camtest').onclick=async()=>{
  const v=$('s-prev');$('s-err').textContent='';
  if(C.isCameraOn()&&!v.hidden){C.stopCamera(v);v.hidden=true;$('s-camtest').textContent='ทดสอบกล้อง';return;}
  try{await C.startCamera(v,$('s-camid').value);v.hidden=false;$('s-camtest').textContent='ปิดกล้องทดสอบ';await fillCameras(true);}
  catch(e){$('s-err').textContent=e.message}
};
// ---- ตั้งค่า ----
$('s-save').onclick=()=>{
  const cd=+$('s-cd').value,rest=+$('s-rest').value,name=$('s-name').value.trim();
  if(!Number.isInteger(cd)||cd<0||cd>10)return $('s-err').textContent='นับถอยหลังต้องเป็นจำนวนเต็ม 0-10';
  if(!Number.isInteger(rest)||rest<1||rest>60)return $('s-err').textContent='เวลาพักต้องเป็นจำนวนเต็ม 1-60';
  cfg.camera=$('s-cam').checked;cfg.cameraId=$('s-camid').value;C.stopCamera($('s-prev'));$('s-prev').hidden=true;$('s-camtest').textContent='ทดสอบกล้อง';
  cfg.playerName=name||'ผู้เล่น';cfg.countdownSec=cd;cfg.restSec=rest;saveCfg();
  st.playerName=cfg.playerName;st.countdownSec=cd;st.restSec=rest;
  renderHome();show('home');
};

// ---- เลือกท่า ----
function renderList(){
  $('list').innerHTML='';$('err').textContent='';
  const lv=G.DIFFICULTY[st.difficulty];
  S.getCatalog().forEach(c=>{
    const q=st.queue.find(x=>x.id===c.id),d=document.createElement('div');d.className='ex';
    const reps=q?q.reps:Math.max(1,Math.round(c.reps*lv.repsMul)),sec=q?q.durationSec:Math.round(c.durationSec*lv.timeMul);
    d.innerHTML=`<input type="checkbox" ${q?'checked':''}><b>${c.name}<small>${c.target}</small></b>
      <label>ครั้ง <input type="number" class="r" min="1" max="100" value="${reps}"></label>
      <label>วิ <input type="number" class="t" min="5" max="600" value="${sec}"></label>`;
    const [cb]=d.querySelectorAll('input'),r=d.querySelector('.r'),t=d.querySelector('.t');
    const apply=()=>{try{$('err').textContent='';
      if(!cb.checked){S.deselectExercise(st,c.id);return;}
      if(!st.queue.some(x=>x.id===c.id))S.selectExercise(st,c.id,{reps:+r.value,durationSec:+t.value});
      else S.setExerciseTarget(st,c.id,{reps:+r.value,durationSec:+t.value});
    }catch(e){$('err').textContent=e.message}};
    cb.onchange=r.onchange=t.onchange=apply;$('list').appendChild(d);
  });
}
$('all').onclick=()=>{S.clearSelection(st);S.selectAll(st);renderList()};
$('clr').onclick=()=>{S.clearSelection(st);renderList()};

// ---- เล่นเกม ----
function render(){
  const p=P.getProgress(st);
  if(st.status==='countdown'){$('big').textContent=p.countdownLeftSec;$('name').textContent='เตรียมตัว '+st.playerName+'...';$('info').textContent='';return;}
  if(!p.exercise)return;
  $('big').textContent=p.resting?p.restLeftSec:p.repsDone+'/'+p.exercise.reps;
  $('name').textContent=(p.resting?'พัก — ถัดไป: ':'')+p.exercise.name+` (${p.index+1}/${p.total})`;
  $('info').textContent=st.status==='paused'?'หยุดชั่วคราว':`เหลือเวลา ${p.timeLeftSec} วินาที`;
}
const detector=C.createMotionRepDetector({onRep:()=>P.registerRep(st)});
function loop(now){
  const d=now-last;last=now;P.tick(st,d);
  if(C.isCameraOn()){
    const active=st.status==='playing'&&st.current&&!st.current.resting;
    if(active){const sc=detector.update($('cam'),now);$('mfill').style.width=Math.min(100,sc/detector.highThreshold*100)+'%';}
    else{detector.reset();$('mfill').style.width='0';}
  }
  render();
  if(st.status==='finished')return finish();
  raf=requestAnimationFrame(loop);
}
function stopCam(){C.stopCamera($('cam'));$('cam').hidden=true;$('mbar').hidden=true;}
function finish(){
  cancelAnimationFrame(raf);stopCam();const s=E.getEndSummary(st);
  $('sum').innerHTML=`<p>${st.playerName} ทำสำเร็จ ${s.completedExercises}/${s.totalExercises} ท่า · รวม ${s.totalReps} ครั้ง · ${s.totalTimeSec} วินาที</p>`+
   s.results.map(r=>`<div class="ex"><b>${r.name}</b><span>${r.repsDone}/${r.targetReps}</span></div>`).join('');
  show('done');
}
$('go').onclick=async()=>{
  try{
    if(!st.queue.length)throw new Error('กรุณาเลือกท่าบริหารอย่างน้อย 1 ท่าก่อนเริ่มเกม');
    $('camerr').textContent='';
    show('play');
    if(cfg.camera){
      try{await C.startCamera($('cam'),cfg.cameraId);$('cam').hidden=false;$('mbar').hidden=false;detector.reset();}
      catch(e){$('camerr').textContent=e.message+' — ใช้ปุ่มกดนับแทนได้';}
    }
    G.startGame(st);$('pause').textContent='หยุด';last=performance.now();raf=requestAnimationFrame(loop);
  }catch(e){show('setup');$('err').textContent=e.message}
};
$('rep').onclick=()=>P.registerRep(st);
$('skip').onclick=()=>P.skipExercise(st);
$('pause').onclick=()=>{E.togglePause(st);$('pause').textContent=st.status==='paused'?'เล่นต่อ':'หยุด'};
$('end').onclick=()=>{E.endGame(st);finish()};
$('rep').title='ใช้เมื่อไม่ได้เปิดกล้อง หรือกล้องนับไม่ทัน';
$('again').onclick=()=>{E.resetGame(st);renderList();show('setup')};

renderHome();show('home');
</script></body></html>

# ขึ้นเว็บอัตโนมัติด้วย GitHub Pages เมื่อ push เข้า main
# ต้องเปิดใช้ก่อน 1 ครั้ง: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions"
# รวมเพลงในโฟลเดอร์ Music ขึ้นเว็บด้วย (--with-music) — ใช้เฉพาะเพลงที่มีสิทธิ์เผยแพร่
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (sync AI files + generate pages)
        run: node "3.Game Control System/build.js"
      - name: Test
        run: node tests/run-tests.js
      - name: Build web package
        run: node "3.Game Control System/build-web.js" --with-music
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
